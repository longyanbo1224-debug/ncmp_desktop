# ncmp GitHub Actions workflow 示例（云端执行模板）
#
# 用法：
#   1. fork ncmp 仓库到自己账号下（https://github.com/ACAne0320/ncmp）
#   2. 把本文件复制到 fork 仓库的 .github/workflows/refresh_cookie.yml
#   3. 在仓库 Settings → Secrets and variables → Actions 加下列 Secrets：
#        MUSIC_U              云音乐 Cookie 的 MUSIC_U（必填）
#        CSRF                 云音乐 Cookie 的 __csrf（必填）
#        NETEASE_PHONE        手机号（密码登录用，与密码二选一）
#        NETEASE_PASSWORD     明文密码（与 MD5 二选一）
#        NETEASE_MD5_PASSWORD MD5 密码（推荐，可用桌面程序「明文→MD5」按钮生成）
#        NOTIFY_EMAIL         接收通知的邮箱（可选）
#        EMAIL_PASSWORD       SMTP 授权码（可选，非邮箱登录密码）
#        SMTP_SERVER          SMTP 服务器（默认 smtp.gmail.com）
#        SMTP_PORT            SMTP 端口（默认 465）
#        WAIT_TIME_MIN        每次评分最小等待秒数（默认 15）
#        WAIT_TIME_MAX        每次评分最大等待秒数（默认 20）
#        FULL_EXTRA_TASKS     是否完成所有额外任务（true/false，默认 false）
#        RANDOM_DELAY_MINUTES 随机延迟启动的最大分钟数（可选：桌面程序「同步完整 workflow」时写入默认值；也可设 Secret 覆盖，0=不启用）
#   4. 在桌面程序「设置 → GitHub Actions」组填：
#        gh_token        GitHub Personal Access Token（需 repo + workflow 权限，存 keyring）
#        gh_repo         owner/repo（如 yourname/ncmp）
#        workflow_name   refresh_cookie.yml
#        workflow_branch main
#   5. 点「测试连接」验证 token+repo；点「同步 Cookie 到 GitHub Secrets」把本地 Cookie 写到仓库 Secrets
#   6. 「任务」页点「云端执行(本地)」旁的「云端执行」按钮触发，或在「定时执行」组配云端 cron
#
# 注：gh_token 仅本地 keyring 保存，不上传。桌面程序通过 GitHub REST API 触发 dispatch + 轮询状态。
# 重要：若 fork 仓库还保留上游的 .github/workflows/auto_score.yml（每日评分），会与本 workflow 重复执行；
#       请删除 auto_score.yml，或注释/删除其 schedule 块，只保留一个评分 workflow。
#
# 测试：到仓库 Actions 页 → 选 refresh_cookie workflow → Run workflow → 手动触发验证
#       关机也能跑：触发后 Actions 在 GitHub 云端执行，桌面程序只看状态，电脑可关机

name: refresh_cookie

on:
  # 手动触发：桌面程序「云端执行」按钮走这个入口（workflow_dispatch API）
  workflow_dispatch:
    inputs:
      score:
        description: '评分策略 1/2/3/4（1=1-2分, 2=2-3分, 3=3-4分默认, 4=固定4分）'
        required: false
        default: '3'
        type: choice
        options: ['1', '2', '3', '4']
      wait_time_min:
        description: '每次评分最小等待秒数（覆盖 Secrets 默认值）'
        required: false
        default: '15'
        type: string
      wait_time_max:
        description: '每次评分最大等待秒数（覆盖 Secrets 默认值）'
        required: false
        default: '20'
        type: string
      full_extra_tasks:
        description: '是否完成所有额外任务（true/false）'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
  # 定时触发：每天 08:00 UTC（北京时间 16:00）跑一次
  # 桌面程序「设置 → GitHub Actions → 云端 cron」可远程修改此 cron 表达式
  # 注意二选一，避免与桌面「设置 → 定时执行 → 模式=云端/both」重复触发：
  #   - 只用 GitHub 原生定时：保留本 schedule 块
  #   - 只用桌面定时触发云端：注释掉整个 schedule 块
  # 不需要定时则注释掉整个 schedule 块
  schedule:
    - cron: '0 8 * * *'

# 同一仓库并发限制：避免多个 run 同时跑触发风控
concurrency:
  group: ncmp-refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 超时保护；随机延迟最多 30 分钟，给足评分余量
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Random delay start (optional)
        env:
          RANDOM_DELAY_MINUTES: ${{ secrets.RANDOM_DELAY_MINUTES || '0' }}
        run: |
          max_min="${RANDOM_DELAY_MINUTES:-0}"
          if ! [[ "${max_min}" =~ ^[0-9]+$ ]]; then
            echo "RANDOM_DELAY_MINUTES 值无效（${max_min}），按 0 处理"
            max_min=0
          fi
          if [ "${max_min}" -gt 0 ]; then
            max_sec=$(( max_min * 60 ))
            delay_sec=$(( RANDOM % (max_sec + 1) ))
            echo "随机延迟启动：${delay_sec} 秒（0–${max_min} 分钟）"
            sleep "${delay_sec}"
          else
            echo "未配置 RANDOM_DELAY_MINUTES 或为 0，跳过随机延迟"
          fi

      - name: Run ncmp
        id: run_ncmp
        continue-on-error: true  # 失败不中断，继续上传日志便于排查
        env:
          MUSIC_U: ${{ secrets.Cookie_MUSIC_U }}
          CSRF: ${{ secrets.Cookie___csrf }}
          NETEASE_PHONE: ${{ secrets.NETEASE_PHONE }}
          NETEASE_PASSWORD: ${{ secrets.NETEASE_PASSWORD }}
          NETEASE_MD5_PASSWORD: ${{ secrets.NETEASE_MD5_PASSWORD }}
          # 通知统一交给下方「Send failure email」步骤，避免与 main.py 内置通知重复发信
          # inputs 优先于 Secrets，手动触发时可用参数覆盖
          WAIT_TIME_MIN: ${{ github.event.inputs.wait_time_min || secrets.WAIT_TIME_MIN }}
          WAIT_TIME_MAX: ${{ github.event.inputs.wait_time_max || secrets.WAIT_TIME_MAX }}
          SCORE: ${{ github.event.inputs.score || '3' }}
          FULL_EXTRA_TASKS: ${{ github.event.inputs.full_extra_tasks || secrets.FULL_EXTRA_TASKS }}
        run: |
          python main.py 2>&1 | tee run_output.log
          exit_code=${PIPESTATUS[0]}
          # 上游 main.py 在 Cookie 失效 / 任务失败时可能仍以 0 退出，
          # 因此这里同时检查日志中的失败标记，确保下方失败邮件步骤能触发。
          if [ "${exit_code}" -ne 0 ]; then
            echo "::error::ncmp 执行失败（退出码 ${exit_code}）"
            exit "${exit_code}"
          fi
          if grep -Eq "执行失败|程序异常|Cookie失效|Cookie已失效|Cookie未正确设置|Cookie验证失败|没有音乐合伙人权限" run_output.log; then
            echo "::error::ncmp 日志中检测到失败标记，判为执行失败"
            exit 1
          fi
          exit 0

      - name: Upload run log artifact
        if: always()  # 无论成功失败都上传，便于排查
        uses: actions/upload-artifact@v4
        with:
          name: ncmp-run-${{ github.run_id }}
          path: run_output.log
          retention-days: 14  # 14 天后自动清理，节省空间

      - name: Send failure email
        if: ${{ always() && steps.run_ncmp.outcome == 'failure' }}
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.header import Header
          from email.mime.text import MIMEText

          receiver = os.environ.get("NOTIFY_EMAIL", "").strip()
          password = os.environ.get("EMAIL_PASSWORD", "").strip()
          if not receiver or not password:
              print("未配置 NOTIFY_EMAIL / EMAIL_PASSWORD，跳过失败邮件")
              raise SystemExit(0)

          sender = receiver
          server = os.environ.get("SMTP_SERVER", "").strip() or "smtp.gmail.com"
          port = int(os.environ.get("SMTP_PORT", "465").strip() or "465")
          repo = os.environ.get("REPO", "")
          run_number = os.environ.get("RUN_NUMBER", "")
          run_url = os.environ.get("RUN_URL", "")

          tail = ""
          try:
              with open("run_output.log", encoding="utf-8", errors="ignore") as f:
                  tail = "".join(f.readlines()[-40:])
          except Exception:
              pass

          subject = f"ncmp 云端执行失败（{repo} run #{run_number}）"
          body = (
              "GitHub Actions 云端任务执行失败。\n"
              f"仓库：{repo}\n"
              f"Run：{run_url}\n\n"
              f"日志末尾：\n{tail or '（无日志）'}"
          )
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = Header(subject, "utf-8")
          msg["From"] = sender
          msg["To"] = receiver

          try:
              if port == 465:
                  with smtplib.SMTP_SSL(server, port, context=ssl.create_default_context(), timeout=30) as s:
                      s.login(sender, password)
                      s.sendmail(sender, [receiver], msg.as_string())
              else:
                  with smtplib.SMTP(server, port, timeout=30) as s:
                      s.starttls(context=ssl.create_default_context())
                      s.login(sender, password)
                      s.sendmail(sender, [receiver], msg.as_string())
          except Exception as e:
              print(f"发送失败邮件失败：{e}")
              raise SystemExit(0)
          print("已发送失败邮件")
          PY

      - name: Send success email
        if: ${{ always() && steps.run_ncmp.outcome == 'success' }}
        env:
          SEND_SUCCESS_EMAIL: ${{ secrets.SEND_SUCCESS_EMAIL || 'false' }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${SEND_SUCCESS_EMAIL:-false}" != "true" ]; then
            echo "成功邮件通知未开启，跳过"
            exit 0
          fi
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.header import Header
          from email.mime.text import MIMEText

          receiver = os.environ.get("NOTIFY_EMAIL", "").strip()
          password = os.environ.get("EMAIL_PASSWORD", "").strip()
          if not receiver or not password:
              print("未配置 NOTIFY_EMAIL / EMAIL_PASSWORD，跳过成功邮件")
              raise SystemExit(0)

          sender = receiver
          server = os.environ.get("SMTP_SERVER", "").strip() or "smtp.gmail.com"
          port = int(os.environ.get("SMTP_PORT", "465").strip() or "465")
          repo = os.environ.get("REPO", "")
          run_number = os.environ.get("RUN_NUMBER", "")
          run_url = os.environ.get("RUN_URL", "")

          tail = ""
          try:
              with open("run_output.log", encoding="utf-8", errors="ignore") as f:
                  tail = "".join(f.readlines()[-40:])
          except Exception:
              pass

          subject = f"ncmp 云端执行成功（{repo} run #{run_number}）"
          body = (
              "GitHub Actions 云端任务执行成功。\n"
              f"仓库：{repo}\n"
              f"Run：{run_url}\n\n"
              f"日志末尾：\n{tail or '（无日志）'}"
          )
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = Header(subject, "utf-8")
          msg["From"] = sender
          msg["To"] = receiver

          try:
              if port == 465:
                  with smtplib.SMTP_SSL(server, port, context=ssl.create_default_context(), timeout=30) as s:
                      s.login(sender, password)
                      s.sendmail(sender, [receiver], msg.as_string())
              else:
                  with smtplib.SMTP(server, port, timeout=30) as s:
                      s.starttls(context=ssl.create_default_context())
                      s.login(sender, password)
                      s.sendmail(sender, [receiver], msg.as_string())
          except Exception as e:
              print(f"发送成功邮件失败：{e}")
              raise SystemExit(0)
          print("已发送成功邮件")
          PY

      - name: Check result
        if: ${{ steps.run_ncmp.outcome == 'failure' }}
        run: |
          echo "::error::ncmp 执行失败，请下载上方 artifact 查看日志"
          exit 1
